services:
    nginx-proxy:
        image: jwilder/nginx-proxy:alpine
        container_name: cwm_nginx_proxy
        ports:
            - "80:80"
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./docker/nginx-proxy/custom.conf:/etc/nginx/conf.d/custom.conf:ro
        networks:
            - sail
    cwm_api:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        container_name: cwm_api
        hostname: cwm_api
        expose:
            - 80
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            TZ: 'America/New_York'
            VIRTUAL_HOST: dev.api.cwm.com
            VIRTUAL_PORT: 80
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - "dev.api.cwm.com"
        depends_on:
            - cwm_pgsql
            - cwm_redis
            - cwm_mailpit

    cwm_admin:
        image: node:26
        environment:
            VIRTUAL_HOST: dev.admin.cwm.com
            VIRTUAL_PORT: 8080
        container_name: cwm_admin
        hostname: cwm_admin
        expose:
            - 8080
        volumes:
            - ../cwm_admin:/app
        working_dir: /app
        command: bash -c "npm install && npm run dev"
        networks:
            sail:
                aliases:
                    - "dev.admin.cwm.com"
        depends_on:
            - cwm_api

    cwm_app:
        image: node:26
        environment:
            VIRTUAL_HOST: dev.app.cwm.com
            VIRTUAL_PORT: 8080
        container_name: cwm_app
        hostname: cwm_app
        expose:
            - 8080
        volumes:
            - ../cwm_app:/app
        working_dir: /app
        command: bash -c "npm install && npm run dev"
        networks:
            sail:
                aliases:
                    - "dev.app.cwm.com"
        depends_on:
            - cwm_api

    cwm_pgsql:
        image: 'postgres:17-alpine'
        container_name: cwm_pgsql
        hostname: cwm_pgsql
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-celebrateitwithme}'
            POSTGRES_USER: '${DB_USERNAME:-cwm}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-celebrateitwithme}'
                - '-U'
                - '${DB_USERNAME:-cwm}'
            retries: 3
            timeout: 5s
    cwm_redis:
        image: 'redis:8-alpine'
        container_name: cwm_redis
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    cwm_mailpit:
        image: 'axllent/mailpit:latest'
        container_name: cwm_mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
