# git-cliff base config for the Quinvite repos (cwm_api, cwm_app, cwm_admin).
# Copy to the root of each repo as `cliff.toml`. See docs/RELEASING.md.
# Usage: git cliff --tag v0.1.0 --unreleased --prepend CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by git-cliff from conventional commits. Versioning follows SemVer.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  # Noise: merges and release housekeeping
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^merge:", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # Visible groups (the number prefix only fixes the order; it is stripped in the template)
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^chore", group = "<!-- 5 -->Chores" },
  # test/style/ci/build are not listed
  { message = "^(test|style|ci|build)", skip = true },
]
